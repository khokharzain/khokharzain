<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Zain Khokhar — Computer Science and software development</title>
  <desc id="desc">A navy banner with a connected workflow motif and the words Build useful software. Explain it clearly.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e35"/><stop offset="1" stop-color="#192e49"/></linearGradient></defs>
  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>
  <rect x="44" y="44" width="5" height="172" rx="2.5" fill="#6de0c0"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="87" fill="#8ae8d0" font-size="16" letter-spacing="3">BRISBANE · QUT COMPUTER SCIENCE</text>
    <text x="72" y="142" fill="#ffffff" font-size="46" font-weight="700">Zain Khokhar</text>
    <text x="74" y="183" fill="#d2dfef" font-size="22">Build useful software. Explain it clearly.</text>
