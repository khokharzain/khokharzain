  <g fill="#e4f8f1" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle">
    <text x="903" y="91">IDEA</text><text x="903" y="175">BUILD</text><text x="1123" y="91">VERIFY</text><text x="1123" y="175">EXPLAIN</text>
